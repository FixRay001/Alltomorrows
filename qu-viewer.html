<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Стилизованная 3D модель Qu</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #070711;
      color: #f1edf8;
      font-family: Arial, sans-serif;
    }

    #scene {
      height: 100%;
      width: 100%;
    }

    .panel {
      position: fixed;
      left: 20px;
      top: 20px;
      max-width: 360px;
      padding: 16px 18px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      background: rgba(10, 9, 22, 0.72);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 21px;
      letter-spacing: 0.04em;
    }

    p {
      margin: 0;
      color: #d1c8dc;
      font-size: 14px;
      line-height: 1.45;
    }

    .hint {
      margin-top: 10px;
      color: #a994c8;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="scene"></div>
  <section class="panel">
    <h1>Фан-модель Qu</h1>
    <p>
      Это стилизованный low-poly прототип по оригинальной иллюстрации
      “Qu triumphant in the fall of Man”: трапециевидная голова, глазные
      стебли, мандибулы, треугольное тело, длинный хвост и четыре узких
      листовидных крыла.
    </p>
    <p class="hint">Мышь: вращать. Колесо: приблизить. Правая кнопка: двигать камеру.</p>
  </section>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const container = document.querySelector("#scene");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070711);
    scene.fog = new THREE.Fog(0x070711, 8, 24);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(4.8, 3.2, 8.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1.45, 0);

    const bodyMaterial = new THREE.MeshStandardMaterial({
      color: 0x6c4a82,
      roughness: 0.58,
      metalness: 0.12
    });
    const armorMaterial = new THREE.MeshStandardMaterial({
      color: 0x1a1427,
      roughness: 0.5,
      metalness: 0.25
    });
    const wingMaterial = new THREE.MeshStandardMaterial({
      color: 0x2a1d40,
      roughness: 0.7,
      metalness: 0.05,
      transparent: true,
      opacity: 0.72,
      side: THREE.DoubleSide
    });
    const glowMaterial = new THREE.MeshStandardMaterial({
      color: 0xbba0ff,
      emissive: 0x7e42ff,
      emissiveIntensity: 1.8,
      roughness: 0.28
    });
    const appendageMaterial = new THREE.MeshStandardMaterial({
      color: 0x4f365f,
      roughness: 0.64,
      metalness: 0.08
    });

    const qu = new THREE.Group();
    scene.add(qu);

    function addMesh(geometry, material, position, scale = [1, 1, 1], rotation = [0, 0, 0]) {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(...position);
      mesh.scale.set(...scale);
      mesh.rotation.set(...rotation);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      qu.add(mesh);
      return mesh;
    }

    function taperedLimb(name, points, radiusStart, radiusEnd, material) {
      const group = new THREE.Group();
      group.name = name;
      for (let i = 0; i < points.length - 1; i++) {
        const start = new THREE.Vector3(...points[i]);
        const end = new THREE.Vector3(...points[i + 1]);
        const direction = end.clone().sub(start);
        const length = direction.length();
        const radius = THREE.MathUtils.lerp(radiusStart, radiusEnd, i / Math.max(points.length - 2, 1));
        const segment = new THREE.Mesh(
          new THREE.CylinderGeometry(radius * 0.72, radius, length, 7),
          material
        );
        segment.position.copy(start.clone().add(end).multiplyScalar(0.5));
        segment.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
        segment.castShadow = true;
        segment.receiveShadow = true;
        group.add(segment);
      }
      qu.add(group);
      return group;
    }

    const headShape = new THREE.Shape();
    headShape.moveTo(-0.62, 0.28);
    headShape.lineTo(0.62, 0.28);
    headShape.lineTo(0.34, -0.34);
    headShape.lineTo(-0.34, -0.34);
    headShape.lineTo(-0.62, 0.28);
    const head = addMesh(
      new THREE.ExtrudeGeometry(headShape, { depth: 0.1, bevelEnabled: true, bevelSize: 0.018, bevelThickness: 0.02 }),
      bodyMaterial,
      [-0.05, 3.42, 0.38],
      [1, 1.05, 1],
      [0, 0, 0]
    );
    head.name = "inverted-trapezoid-head";

    addMesh(new THREE.CylinderGeometry(0.055, 0.07, 0.26, 8), armorMaterial, [0, 3.72, 0.46], [1, 1, 1], [Math.PI / 2, 0, 0]).name = "forehead-orifice";
    taperedLimb("left-upper-eye-stalk", [[-0.42, 3.58, 0.42], [-0.82, 3.6, 0.5], [-1.16, 3.54, 0.48]], 0.045, 0.022, appendageMaterial);
    taperedLimb("right-upper-eye-stalk", [[0.42, 3.58, 0.42], [0.82, 3.6, 0.5], [1.16, 3.54, 0.48]], 0.045, 0.022, appendageMaterial);
    addMesh(new THREE.SphereGeometry(0.09, 12, 8), glowMaterial, [-1.22, 3.52, 0.48], [1.3, 0.85, 0.9]).name = "left-compound-eye";
    addMesh(new THREE.SphereGeometry(0.09, 12, 8), glowMaterial, [1.22, 3.52, 0.48], [1.3, 0.85, 0.9]).name = "right-compound-eye";
    taperedLimb("left-lower-eye-stalk", [[-0.28, 3.34, 0.45], [-0.58, 3.22, 0.5], [-0.84, 3.18, 0.46]], 0.03, 0.016, appendageMaterial);
    taperedLimb("right-lower-eye-stalk", [[0.28, 3.34, 0.45], [0.58, 3.22, 0.5], [0.84, 3.18, 0.46]], 0.03, 0.016, appendageMaterial);
    addMesh(new THREE.SphereGeometry(0.052, 10, 8), glowMaterial, [-0.9, 3.17, 0.46], [1.15, 0.8, 0.8]).name = "left-lower-eye";
    addMesh(new THREE.SphereGeometry(0.052, 10, 8), glowMaterial, [0.9, 3.17, 0.46], [1.15, 0.8, 0.8]).name = "right-lower-eye";

    taperedLimb("lower-mandible-left", [[-0.18, 3.1, 0.47], [-0.48, 2.84, 0.54], [-0.62, 2.52, 0.42]], 0.04, 0.018, armorMaterial);
    taperedLimb("lower-mandible-right", [[0.18, 3.1, 0.47], [0.48, 2.84, 0.54], [0.62, 2.52, 0.42]], 0.04, 0.018, armorMaterial);
    taperedLimb("upper-mandible-left", [[-0.08, 3.16, 0.5], [-0.26, 2.96, 0.56], [-0.35, 2.78, 0.5]], 0.026, 0.014, armorMaterial);
    taperedLimb("upper-mandible-right", [[0.08, 3.16, 0.5], [0.26, 2.96, 0.56], [0.35, 2.78, 0.5]], 0.026, 0.014, armorMaterial);

    const thorax = addMesh(new THREE.ConeGeometry(0.7, 1.2, 3), bodyMaterial, [0, 2.45, 0.02], [0.78, 1.05, 0.52], [Math.PI, Math.PI / 3, 0]);
    thorax.name = "inverted-triangle-body";
    const abdomen = addMesh(new THREE.CapsuleGeometry(0.23, 0.72, 5, 8), armorMaterial, [0, 1.8, -0.04], [0.72, 1, 0.45]);
    abdomen.name = "small-lower-abdomen";

    for (let i = 0; i < 5; i++) {
      addMesh(
        new THREE.TorusGeometry(0.21 - i * 0.012, 0.012, 5, 28),
        armorMaterial,
        [0, 2.08 - i * 0.16, -0.05],
        [1, 0.48, 0.52],
        [Math.PI / 2, 0, 0]
      ).name = `body-segment-${i + 1}`;
    }

    taperedLimb("long-prehensile-tail", [[0, 1.38, -0.06], [0.06, 0.76, -0.1], [-0.05, 0.1, -0.14], [0.04, -0.58, -0.08], [0, -1.22, 0.02]], 0.105, 0.018, appendageMaterial);

    taperedLimb("left-forelimb", [[-0.3, 2.62, 0.02], [-0.74, 2.12, 0.1], [-1.02, 1.44, 0.04], [-1.28, 0.92, 0.16]], 0.07, 0.02, appendageMaterial);
    taperedLimb("right-forelimb", [[0.3, 2.62, 0.02], [0.74, 2.12, 0.1], [1.02, 1.44, 0.04], [1.28, 0.92, 0.16]], 0.07, 0.02, appendageMaterial);
    taperedLimb("left-hindlimb", [[-0.2, 1.82, -0.05], [-0.58, 1.18, -0.14], [-0.72, 0.48, -0.1]], 0.075, 0.024, armorMaterial);
    taperedLimb("right-hindlimb", [[0.2, 1.82, -0.05], [0.58, 1.18, -0.14], [0.72, 0.48, -0.1]], 0.075, 0.024, armorMaterial);

    const wingShape = new THREE.Shape();
    wingShape.moveTo(0, 0);
    wingShape.bezierCurveTo(0.28, 0.56, 0.52, 1.72, 0.28, 3.08);
    wingShape.bezierCurveTo(0.08, 2.22, -0.18, 0.88, 0, 0);
    const wingGeometry = new THREE.ShapeGeometry(wingShape, 36);

    const wings = [];
    function addWing(name, side, yOffset, scale, rotationY, rotationZ) {
      const wing = new THREE.Mesh(wingGeometry, wingMaterial);
      wing.name = name;
      wing.position.set(0.18 * side, yOffset, -0.2);
      wing.rotation.set(0.08, rotationY * side, rotationZ * side);
      wing.scale.set(scale * side, scale, 1);
      wing.castShadow = true;
      qu.add(wing);
      wings.push(wing);

      const muscle = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.07, 0.52, 7), armorMaterial);
      muscle.name = `${name}-basal-muscle`;
      muscle.position.set(0.18 * side, yOffset + 0.04, -0.16);
      muscle.rotation.set(1.28, 0.22 * side, 0.2 * side);
      qu.add(muscle);
    }

    addWing("left-upper-leaf-wing", -1, 2.02, 1.03, 0.5, 0.36);
    addWing("right-upper-leaf-wing", 1, 2.02, 1.03, 0.5, 0.36);
    addWing("left-lower-leaf-wing", -1, 1.36, 0.78, 0.42, 0.24);
    addWing("right-lower-leaf-wing", 1, 1.36, 0.78, 0.42, 0.24);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(5.2, 72),
      new THREE.MeshStandardMaterial({ color: 0x14101f, roughness: 0.85 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.91;
    ground.receiveShadow = true;
    scene.add(ground);

    scene.add(new THREE.HemisphereLight(0xd9c9ff, 0x111018, 2.4));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.8);
    keyLight.position.set(3.5, 5.6, 4.2);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    scene.add(keyLight);

    const rimLight = new THREE.PointLight(0x7a4dff, 18, 8);
    rimLight.position.set(-2.8, 2.8, -2.4);
    scene.add(rimLight);

    for (let i = 0; i < 110; i++) {
      const star = new THREE.Mesh(new THREE.SphereGeometry(0.01 + Math.random() * 0.018, 6, 6), glowMaterial);
      star.position.set(
        (Math.random() - 0.5) * 18,
        Math.random() * 9,
        -5 - Math.random() * 8
      );
      scene.add(star);
    }

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener("resize", resize);

    const clock = new THREE.Clock();
    function animate() {
      const time = clock.getElapsedTime();
      qu.rotation.y = Math.sin(time * 0.34) * 0.12;
      qu.position.y = Math.sin(time * 1.4) * 0.035;
      wings.forEach((wing, index) => {
        wing.rotation.z += Math.sin(time * 1.6 + index) * 0.0009;
      });
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
