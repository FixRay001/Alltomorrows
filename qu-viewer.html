<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Стилизованная 3D модель Qu</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #070711;
      color: #f1edf8;
      font-family: Arial, sans-serif;
    }

    #scene {
      height: 100%;
      width: 100%;
    }

    .panel {
      position: fixed;
      left: 20px;
      top: 20px;
      max-width: 360px;
      padding: 16px 18px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      background: rgba(10, 9, 22, 0.72);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 21px;
      letter-spacing: 0.04em;
    }

    p {
      margin: 0;
      color: #d1c8dc;
      font-size: 14px;
      line-height: 1.45;
    }

    .hint {
      margin-top: 10px;
      color: #a994c8;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="scene"></div>
  <section class="panel">
    <h1>Фан-модель Qu</h1>
    <p>
      Это не точная копия, а стилизованный low-poly прототип, ближе к знакомому
      образу Qu: вытянутая инсектоидная фигура, большие крылья, тонкие лапы и
      клювовидная голова.
    </p>
    <p class="hint">Мышь: вращать. Колесо: приблизить. Правая кнопка: двигать камеру.</p>
  </section>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const container = document.querySelector("#scene");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070711);
    scene.fog = new THREE.Fog(0x070711, 8, 24);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(4.8, 3.2, 8.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1.45, 0);

    const bodyMaterial = new THREE.MeshStandardMaterial({
      color: 0x6c4a82,
      roughness: 0.58,
      metalness: 0.12
    });
    const armorMaterial = new THREE.MeshStandardMaterial({
      color: 0x1a1427,
      roughness: 0.5,
      metalness: 0.25
    });
    const wingMaterial = new THREE.MeshStandardMaterial({
      color: 0x2a1d40,
      roughness: 0.7,
      metalness: 0.05,
      transparent: true,
      opacity: 0.72,
      side: THREE.DoubleSide
    });
    const glowMaterial = new THREE.MeshStandardMaterial({
      color: 0xbba0ff,
      emissive: 0x7e42ff,
      emissiveIntensity: 1.8,
      roughness: 0.28
    });
    const appendageMaterial = new THREE.MeshStandardMaterial({
      color: 0x4f365f,
      roughness: 0.64,
      metalness: 0.08
    });

    const qu = new THREE.Group();
    scene.add(qu);

    function addMesh(geometry, material, position, scale = [1, 1, 1], rotation = [0, 0, 0]) {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(...position);
      mesh.scale.set(...scale);
      mesh.rotation.set(...rotation);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      qu.add(mesh);
      return mesh;
    }

    function taperedLimb(name, points, radiusStart, radiusEnd, material) {
      const group = new THREE.Group();
      group.name = name;
      for (let i = 0; i < points.length - 1; i++) {
        const start = new THREE.Vector3(...points[i]);
        const end = new THREE.Vector3(...points[i + 1]);
        const direction = end.clone().sub(start);
        const length = direction.length();
        const radius = THREE.MathUtils.lerp(radiusStart, radiusEnd, i / Math.max(points.length - 2, 1));
        const segment = new THREE.Mesh(
          new THREE.CylinderGeometry(radius * 0.72, radius, length, 7),
          material
        );
        segment.position.copy(start.clone().add(end).multiplyScalar(0.5));
        segment.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
        segment.castShadow = true;
        segment.receiveShadow = true;
        group.add(segment);
      }
      qu.add(group);
      return group;
    }

    const torso = addMesh(new THREE.CapsuleGeometry(0.28, 2.35, 6, 10), bodyMaterial, [0, 1.52, 0], [0.72, 1.18, 0.42]);
    torso.name = "thin-vertical-torso";
    const neck = addMesh(new THREE.CapsuleGeometry(0.18, 0.62, 5, 8), armorMaterial, [0, 2.88, 0.03], [0.58, 1, 0.38]);
    neck.name = "long-armored-neck";
    const head = addMesh(new THREE.IcosahedronGeometry(0.38, 1), bodyMaterial, [0, 3.42, 0.12], [0.72, 0.88, 1.22], [-0.1, 0, 0]);
    head.name = "insectoid-birdlike-head";
    const beak = addMesh(new THREE.ConeGeometry(0.13, 0.82, 7), armorMaterial, [0, 3.34, 0.78], [0.9, 1, 0.62], [Math.PI / 2, 0, 0]);
    beak.name = "forward-beak";
    addMesh(new THREE.SphereGeometry(0.095, 16, 10), glowMaterial, [-0.16, 3.48, 0.43], [1.25, 0.72, 0.55]);
    addMesh(new THREE.SphereGeometry(0.095, 16, 10), glowMaterial, [0.16, 3.48, 0.43], [1.25, 0.72, 0.55]);

    taperedLimb("left-antenna", [[-0.08, 3.76, 0.08], [-0.34, 4.15, 0.16], [-0.52, 4.45, 0.08]], 0.035, 0.014, armorMaterial);
    taperedLimb("right-antenna", [[0.08, 3.76, 0.08], [0.34, 4.15, 0.16], [0.52, 4.45, 0.08]], 0.035, 0.014, armorMaterial);

    for (let i = 0; i < 9; i++) {
      addMesh(
        new THREE.TorusGeometry(0.23 - i * 0.008, 0.016, 6, 32),
        armorMaterial,
        [0, 2.46 - i * 0.22, -0.01],
        [1, 0.55, 0.58],
        [Math.PI / 2, 0, 0]
      );
    }

    taperedLimb("left-foreleg", [[-0.18, 2.55, 0.06], [-0.72, 2.05, 0.34], [-1.08, 1.28, 0.2], [-1.46, 0.62, 0.32]], 0.075, 0.026, appendageMaterial);
    taperedLimb("right-foreleg", [[0.18, 2.55, 0.06], [0.72, 2.05, 0.34], [1.08, 1.28, 0.2], [1.46, 0.62, 0.32]], 0.075, 0.026, appendageMaterial);
    taperedLimb("left-mid-limb", [[-0.2, 1.68, 0.02], [-0.88, 1.1, -0.1], [-1.22, 0.34, -0.16], [-1.62, -0.36, -0.05]], 0.085, 0.03, armorMaterial);
    taperedLimb("right-mid-limb", [[0.2, 1.68, 0.02], [0.88, 1.1, -0.1], [1.22, 0.34, -0.16], [1.62, -0.36, -0.05]], 0.085, 0.03, armorMaterial);
    taperedLimb("left-rear-limb", [[-0.16, 0.78, -0.03], [-0.56, 0.1, -0.18], [-0.74, -0.62, -0.28]], 0.095, 0.034, armorMaterial);
    taperedLimb("right-rear-limb", [[0.16, 0.78, -0.03], [0.56, 0.1, -0.18], [0.74, -0.62, -0.28]], 0.095, 0.034, armorMaterial);

    addMesh(new THREE.ConeGeometry(0.07, 0.32, 5), armorMaterial, [-1.52, 0.48, 0.34], [0.62, 1, 0.62], [-0.12, 0, 0.46]);
    addMesh(new THREE.ConeGeometry(0.07, 0.32, 5), armorMaterial, [1.52, 0.48, 0.34], [0.62, 1, 0.62], [-0.12, 0, -0.46]);
    addMesh(new THREE.ConeGeometry(0.08, 0.38, 5), armorMaterial, [-1.66, -0.5, -0.04], [0.6, 1, 0.6], [-0.25, 0, 0.35]);
    addMesh(new THREE.ConeGeometry(0.08, 0.38, 5), armorMaterial, [1.66, -0.5, -0.04], [0.6, 1, 0.6], [-0.25, 0, -0.35]);

    const wingShape = new THREE.Shape();
    wingShape.moveTo(0, 0);
    wingShape.bezierCurveTo(0.85, 0.58, 1.96, 1.54, 2.18, 2.82);
    wingShape.bezierCurveTo(1.22, 2.55, 0.42, 1.2, 0, 0);
    const wingGeometry = new THREE.ShapeGeometry(wingShape, 32);

    const wings = [];
    function addWing(side, yOffset, scale, rotationZ) {
      const sideName = side < 0 ? "left" : "right";
      const wing = new THREE.Mesh(wingGeometry, wingMaterial);
      wing.name = `${sideName}-wing`;
      wing.position.set(0.18 * side, yOffset, -0.22);
      wing.rotation.set(0.24, 0.55 * side, rotationZ);
      wing.scale.set(scale * side, scale, 1);
      wing.castShadow = true;
      qu.add(wing);
      wings.push(wing);

      for (let i = 0; i < 4; i++) {
        const vein = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.014, 1.8 + i * 0.14, 5), glowMaterial);
        vein.name = `${sideName}-wing-vein-${i + 1}`;
        vein.position.set((0.46 + i * 0.22) * side, yOffset + 0.58 + i * 0.3, -0.17);
        vein.rotation.set(1.18, 0.12 * side, (0.62 + i * 0.12) * side);
        vein.scale.x = 0.42;
        qu.add(vein);
      }
    }

    addWing(-1, 1.98, 1.22, 0.42);
    addWing(1, 1.98, 1.22, -0.42);
    addWing(-1, 1.22, 0.82, 0.24);
    addWing(1, 1.22, 0.82, -0.24);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(5.2, 72),
      new THREE.MeshStandardMaterial({ color: 0x14101f, roughness: 0.85 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.91;
    ground.receiveShadow = true;
    scene.add(ground);

    scene.add(new THREE.HemisphereLight(0xd9c9ff, 0x111018, 2.4));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.8);
    keyLight.position.set(3.5, 5.6, 4.2);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    scene.add(keyLight);

    const rimLight = new THREE.PointLight(0x7a4dff, 18, 8);
    rimLight.position.set(-2.8, 2.8, -2.4);
    scene.add(rimLight);

    for (let i = 0; i < 110; i++) {
      const star = new THREE.Mesh(new THREE.SphereGeometry(0.01 + Math.random() * 0.018, 6, 6), glowMaterial);
      star.position.set(
        (Math.random() - 0.5) * 18,
        Math.random() * 9,
        -5 - Math.random() * 8
      );
      scene.add(star);
    }

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener("resize", resize);

    const clock = new THREE.Clock();
    function animate() {
      const time = clock.getElapsedTime();
      qu.rotation.y = Math.sin(time * 0.34) * 0.12;
      qu.position.y = Math.sin(time * 1.4) * 0.035;
      wings.forEach((wing, index) => {
        wing.rotation.z += Math.sin(time * 1.6 + index) * 0.0009;
      });
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
