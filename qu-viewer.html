<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Стилизованная 3D модель Qu</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #d9c6a4;
      color: #2a2118;
      font-family: Arial, sans-serif;
    }

    #scene {
      height: 100%;
      width: 100%;
    }

    .panel {
      position: fixed;
      left: 20px;
      top: 20px;
      max-width: 360px;
      padding: 16px 18px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      background: rgba(238, 224, 193, 0.78);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 21px;
      letter-spacing: 0.04em;
    }

    p {
      margin: 0;
      color: #3f3326;
      font-size: 14px;
      line-height: 1.45;
    }

    .hint {
      margin-top: 10px;
      color: #6e583f;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="scene"></div>
  <section class="panel">
    <h1>Фан-модель Qu</h1>
    <p>
      Это более точная fan-made 3D интерпретация по оригинальной иллюстрации
      “Qu triumphant in the fall of Man”: сепийная палитра, тёмный хитин,
      янтарные глаза, мембраны, длинный хвост и четыре узких листовидных крыла.
    </p>
    <p class="hint">Мышь: вращать. Колесо: приблизить. Правая кнопка: двигать камеру.</p>
  </section>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const container = document.querySelector("#scene");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xd9c6a4);
    scene.fog = new THREE.Fog(0xd9c6a4, 9, 26);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(4.8, 3.2, 8.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1.45, 0);

    const bodyMaterial = new THREE.MeshStandardMaterial({
      color: 0x7b6748,
      roughness: 0.88,
      metalness: 0.02
    });
    const armorMaterial = new THREE.MeshStandardMaterial({
      color: 0x2f271d,
      roughness: 0.82,
      metalness: 0.04
    });
    const wingMaterial = new THREE.MeshStandardMaterial({
      color: 0xb7a77d,
      roughness: 0.76,
      metalness: 0.05,
      transparent: true,
      opacity: 0.46,
      side: THREE.DoubleSide
    });
    const glowMaterial = new THREE.MeshStandardMaterial({
      color: 0xffd98a,
      emissive: 0xc26a1a,
      emissiveIntensity: 1.25,
      roughness: 0.36
    });
    const appendageMaterial = new THREE.MeshStandardMaterial({
      color: 0x5a4832,
      roughness: 0.86,
      metalness: 0.02
    });
    const membraneMaterial = new THREE.MeshStandardMaterial({
      color: 0x9c875f,
      roughness: 0.8,
      transparent: true,
      opacity: 0.42,
      side: THREE.DoubleSide
    });
    const inkMaterial = new THREE.MeshStandardMaterial({
      color: 0x211a13,
      roughness: 0.9,
      metalness: 0
    });
    const sepiaWashMaterial = new THREE.MeshStandardMaterial({
      color: 0xe6d3aa,
      roughness: 1,
      transparent: true,
      opacity: 0.18,
      side: THREE.DoubleSide
    });

    const qu = new THREE.Group();
    scene.add(qu);

    function smoothGeometry(geometry) {
      geometry.computeVertexNormals();
      return geometry;
    }

    function addMesh(geometry, material, position, scale = [1, 1, 1], rotation = [0, 0, 0]) {
      smoothGeometry(geometry);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(...position);
      mesh.scale.set(...scale);
      mesh.rotation.set(...rotation);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      qu.add(mesh);
      return mesh;
    }

    function taperedLimb(name, points, radiusStart, radiusEnd, material) {
      const group = new THREE.Group();
      group.name = name;
      for (let i = 0; i < points.length - 1; i++) {
        const start = new THREE.Vector3(...points[i]);
        const end = new THREE.Vector3(...points[i + 1]);
        const direction = end.clone().sub(start);
        const length = direction.length();
        const radius = THREE.MathUtils.lerp(radiusStart, radiusEnd, i / Math.max(points.length - 2, 1));
        const segment = new THREE.Mesh(
          smoothGeometry(new THREE.CylinderGeometry(radius * 0.72, radius, length, 16, 4)),
          material
        );
        segment.position.copy(start.clone().add(end).multiplyScalar(0.5));
        segment.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
        segment.castShadow = true;
        segment.receiveShadow = true;
        group.add(segment);
      }
      points.forEach((point, index) => {
        const t = index / Math.max(points.length - 1, 1);
        const radius = THREE.MathUtils.lerp(radiusStart, radiusEnd, t) * 0.86;
        const joint = new THREE.Mesh(
          smoothGeometry(new THREE.SphereGeometry(radius, 16, 10)),
          material
        );
        joint.name = `${name}-soft-joint-${index + 1}`;
        joint.position.set(...point);
        joint.castShadow = true;
        joint.receiveShadow = true;
        group.add(joint);
      });
      qu.add(group);
      return group;
    }

    const headShape = new THREE.Shape();
    headShape.moveTo(-0.58, 0.26);
    headShape.quadraticCurveTo(0, 0.36, 0.58, 0.26);
    headShape.quadraticCurveTo(0.48, -0.08, 0.32, -0.34);
    headShape.quadraticCurveTo(0, -0.44, -0.32, -0.34);
    headShape.quadraticCurveTo(-0.48, -0.08, -0.58, 0.26);
    const head = addMesh(
      new THREE.ExtrudeGeometry(headShape, { depth: 0.14, bevelEnabled: true, bevelSize: 0.035, bevelThickness: 0.035, bevelSegments: 5 }),
      bodyMaterial,
      [-0.05, 3.42, 0.38],
      [1, 1.05, 1],
      [0, 0, 0]
    );
    head.name = "inverted-trapezoid-head";

    addMesh(new THREE.CylinderGeometry(0.055, 0.07, 0.26, 18, 2), armorMaterial, [0, 3.72, 0.46], [1, 1, 1], [Math.PI / 2, 0, 0]).name = "forehead-orifice";
    for (let i = 0; i < 8; i++) {
      addMesh(
        new THREE.SphereGeometry(0.016 + (i % 3) * 0.004, 14, 10),
        inkMaterial,
        [-0.34 + i * 0.1, 3.5 + Math.sin(i * 1.7) * 0.09, 0.455],
        [1.35, 0.72, 0.35]
      ).name = `head-mottle-${i + 1}`;
    }
    taperedLimb("left-upper-eye-stalk", [[-0.42, 3.58, 0.42], [-0.82, 3.6, 0.5], [-1.16, 3.54, 0.48]], 0.045, 0.022, appendageMaterial);
    taperedLimb("right-upper-eye-stalk", [[0.42, 3.58, 0.42], [0.82, 3.6, 0.5], [1.16, 3.54, 0.48]], 0.045, 0.022, appendageMaterial);
    addMesh(new THREE.SphereGeometry(0.09, 24, 16), glowMaterial, [-1.22, 3.52, 0.48], [1.3, 0.85, 0.9]).name = "left-compound-eye";
    addMesh(new THREE.SphereGeometry(0.09, 24, 16), glowMaterial, [1.22, 3.52, 0.48], [1.3, 0.85, 0.9]).name = "right-compound-eye";
    taperedLimb("left-lower-eye-stalk", [[-0.28, 3.34, 0.45], [-0.58, 3.22, 0.5], [-0.84, 3.18, 0.46]], 0.03, 0.016, appendageMaterial);
    taperedLimb("right-lower-eye-stalk", [[0.28, 3.34, 0.45], [0.58, 3.22, 0.5], [0.84, 3.18, 0.46]], 0.03, 0.016, appendageMaterial);
    addMesh(new THREE.SphereGeometry(0.052, 18, 12), glowMaterial, [-0.9, 3.17, 0.46], [1.15, 0.8, 0.8]).name = "left-lower-eye";
    addMesh(new THREE.SphereGeometry(0.052, 18, 12), glowMaterial, [0.9, 3.17, 0.46], [1.15, 0.8, 0.8]).name = "right-lower-eye";

    taperedLimb("lower-mandible-left", [[-0.18, 3.1, 0.47], [-0.48, 2.84, 0.54], [-0.62, 2.52, 0.42]], 0.04, 0.018, armorMaterial);
    taperedLimb("lower-mandible-right", [[0.18, 3.1, 0.47], [0.48, 2.84, 0.54], [0.62, 2.52, 0.42]], 0.04, 0.018, armorMaterial);
    taperedLimb("upper-mandible-left", [[-0.08, 3.16, 0.5], [-0.26, 2.96, 0.56], [-0.35, 2.78, 0.5]], 0.026, 0.014, armorMaterial);
    taperedLimb("upper-mandible-right", [[0.08, 3.16, 0.5], [0.26, 2.96, 0.56], [0.35, 2.78, 0.5]], 0.026, 0.014, armorMaterial);

    const mandibleMembraneShape = new THREE.Shape();
    mandibleMembraneShape.moveTo(-0.22, 0);
    mandibleMembraneShape.lineTo(0.22, 0);
    mandibleMembraneShape.lineTo(0.08, -0.42);
    mandibleMembraneShape.lineTo(-0.08, -0.42);
    mandibleMembraneShape.lineTo(-0.22, 0);
    const mandibleMembrane = addMesh(
      new THREE.ShapeGeometry(mandibleMembraneShape),
      membraneMaterial,
      [0, 3.02, 0.515],
      [1, 1, 1],
      [0.06, 0, 0]
    );
    mandibleMembrane.name = "mandible-membrane";

    const thorax = addMesh(new THREE.ConeGeometry(0.64, 1.22, 32, 8), bodyMaterial, [0, 2.45, 0.02], [0.78, 1.05, 0.52], [Math.PI, 0, 0]);
    thorax.name = "smooth-inverted-triangle-body";
    const abdomen = addMesh(new THREE.CapsuleGeometry(0.23, 0.72, 10, 16), armorMaterial, [0, 1.8, -0.04], [0.72, 1, 0.45]);
    abdomen.name = "small-lower-abdomen";

    for (let i = 0; i < 7; i++) {
      addMesh(
        new THREE.SphereGeometry(0.022 + i * 0.002, 14, 10),
        inkMaterial,
        [(i % 2 ? 0.18 : -0.18), 2.86 - i * 0.17, 0.31],
        [1.4, 0.75, 0.4]
      ).name = `dark-body-speckle-${i + 1}`;
    }

    for (let i = 0; i < 5; i++) {
      addMesh(
        new THREE.TorusGeometry(0.21 - i * 0.012, 0.012, 12, 60),
        armorMaterial,
        [0, 2.08 - i * 0.16, -0.05],
        [1, 0.48, 0.52],
        [Math.PI / 2, 0, 0]
      ).name = `body-segment-${i + 1}`;
    }

    taperedLimb("long-prehensile-tail", [[0, 1.38, -0.06], [0.04, 1.02, -0.08], [0.06, 0.62, -0.1], [0, 0.18, -0.14], [-0.05, -0.26, -0.12], [0.02, -0.74, -0.05], [0, -1.22, 0.02]], 0.105, 0.018, appendageMaterial);

    taperedLimb("left-forelimb", [[-0.3, 2.62, 0.02], [-0.55, 2.34, 0.08], [-0.78, 1.96, 0.1], [-0.98, 1.48, 0.05], [-1.28, 0.92, 0.16]], 0.062, 0.018, appendageMaterial);
    taperedLimb("right-forelimb", [[0.3, 2.62, 0.02], [0.55, 2.34, 0.08], [0.78, 1.96, 0.1], [0.98, 1.48, 0.05], [1.28, 0.92, 0.16]], 0.062, 0.018, appendageMaterial);
    taperedLimb("left-hindlimb", [[-0.2, 1.82, -0.05], [-0.42, 1.46, -0.12], [-0.58, 1.02, -0.14], [-0.72, 0.48, -0.1]], 0.068, 0.022, armorMaterial);
    taperedLimb("right-hindlimb", [[0.2, 1.82, -0.05], [0.42, 1.46, -0.12], [0.58, 1.02, -0.14], [0.72, 0.48, -0.1]], 0.068, 0.022, armorMaterial);

    const wingShape = new THREE.Shape();
    wingShape.moveTo(0, 0);
    wingShape.bezierCurveTo(0.22, 0.46, 0.5, 1.65, 0.3, 3.16);
    wingShape.bezierCurveTo(0.12, 2.46, -0.2, 1.05, 0, 0);
    const wingGeometry = new THREE.ShapeGeometry(wingShape, 96);

    const wings = [];
    function addWing(name, side, yOffset, scale, rotationY, rotationZ) {
      const wing = new THREE.Mesh(wingGeometry, wingMaterial);
      wing.name = name;
      wing.position.set(0.18 * side, yOffset, -0.2);
      wing.rotation.set(0.08, rotationY * side, rotationZ * side);
      wing.scale.set(scale * side, scale, 1);
      wing.castShadow = true;
      qu.add(wing);
      wings.push(wing);

      const muscle = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.07, 0.52, 16, 3), armorMaterial);
      muscle.geometry.computeVertexNormals();
      muscle.name = `${name}-basal-muscle`;
      muscle.position.set(0.18 * side, yOffset + 0.04, -0.16);
      muscle.rotation.set(1.28, 0.22 * side, 0.2 * side);
      qu.add(muscle);

      for (let i = 0; i < 3; i++) {
        const vein = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.011, 1.72 + i * 0.22, 12, 3), armorMaterial);
        vein.geometry.computeVertexNormals();
        vein.name = `${name}-wing-vein-${i + 1}`;
        vein.position.set((0.09 + i * 0.045) * side, yOffset + 0.74 + i * 0.36, -0.145);
        vein.rotation.set(1.1, 0.17 * side, (0.12 + i * 0.1) * side);
        qu.add(vein);
      }
    }

    addWing("left-upper-leaf-wing", -1, 2.02, 1.03, 0.5, 0.36);
    addWing("right-upper-leaf-wing", 1, 2.02, 1.03, 0.5, 0.36);
    addWing("left-lower-leaf-wing", -1, 1.36, 0.78, 0.42, 0.24);
    addWing("right-lower-leaf-wing", 1, 1.36, 0.78, 0.42, 0.24);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(5.2, 72),
      new THREE.MeshStandardMaterial({ color: 0xc9b58c, roughness: 0.9 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.91;
    ground.receiveShadow = true;
    scene.add(ground);

    const sepiaWash = new THREE.Mesh(new THREE.CircleGeometry(5.05, 72), sepiaWashMaterial);
    sepiaWash.name = "sepia-wash-overlay";
    sepiaWash.rotation.x = -Math.PI / 2;
    sepiaWash.position.y = -0.905;
    scene.add(sepiaWash);

    scene.add(new THREE.HemisphereLight(0xf7e6c1, 0x5f4d35, 2.1));
    const keyLight = new THREE.DirectionalLight(0xfff0cb, 2.55);
    keyLight.position.set(3.5, 5.6, 4.2);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    scene.add(keyLight);

    const rimLight = new THREE.PointLight(0x9b6f37, 7, 8);
    rimLight.position.set(-2.8, 2.8, -2.4);
    scene.add(rimLight);

    for (let i = 0; i < 110; i++) {
      const star = new THREE.Mesh(new THREE.SphereGeometry(0.006 + Math.random() * 0.012, 6, 6), inkMaterial);
      star.position.set(
        (Math.random() - 0.5) * 18,
        Math.random() * 9,
        -5 - Math.random() * 8
      );
      scene.add(star);
    }

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener("resize", resize);

    const clock = new THREE.Clock();
    function animate() {
      const time = clock.getElapsedTime();
      qu.rotation.y = Math.sin(time * 0.34) * 0.12;
      qu.position.y = Math.sin(time * 1.4) * 0.035;
      wings.forEach((wing, index) => {
        wing.rotation.z += Math.sin(time * 1.6 + index) * 0.0009;
      });
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
